<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ALQUID Data Tools</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'Fira Code', 'monospace'],
          },
          colors: {
            nafra: {
              bg: '#0a0f1a',
              surface: '#0d1926',
              card: '#111b27',
              'card-hover': '#162234',
              border: '#1a2a3a',
              'border-light': '#243447',
              accent: '#297cf2',
              'accent-dim': '#1e5fbd',
              text: '#e8edf3',
              'text-dim': '#8899aa',
              'text-muted': '#5a6a7a',
              sidebar: '#080d16',
              danger: '#e85d45',
              warning: '#ffb84d',
              success: '#297cf2'
            },
            alquid: {
              navy: '#0a0f1a',
              orange: '#e85d45',
              red: '#e85d45',
              blue: '#297cf2',
              lightBlue: '#162234',
              gray10: '#0d1926',
              gray25: '#0a0f1a',
              gray40: '#243447',
              grayDark: '#e8edf3'
            }
          },
          boxShadow: {
            'premium': '0 20px 60px -24px rgba(0, 0, 0, 0.75), 0 8px 24px -16px rgba(41, 124, 242, 0.15)',
            'inner-soft': 'inset 0 1px 0 0 rgba(255, 255, 255, 0.03)',
          },
          animation: {
            'fade-in': 'fadeIn 0.4s ease-out',
            'slide-up': 'slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1)',
            'scale-in': 'scaleIn 0.3s cubic-bezier(0.16, 1, 0.3, 1)',
            'float': 'float 3s ease-in-out infinite',
          },
          keyframes: {
            fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
            slideUp: { '0%': { transform: 'translateY(10px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } },
            scaleIn: { '0%': { transform: 'scale(0.95)', opacity: '0' }, '100%': { transform: 'scale(1)', opacity: '1' } },
            float: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-5px)' } },
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background:
        radial-gradient(circle at top left, rgba(41, 124, 242, 0.12), transparent 28%),
        radial-gradient(circle at top right, rgba(41, 124, 242, 0.08), transparent 24%),
        linear-gradient(180deg, #0a0f1a 0%, #0a0f1a 100%);
      color: #e8edf3;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
    }

    .glass-card {
      background: rgba(17, 27, 39, 0.82);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(36, 52, 71, 0.85);
    }

    .alquid-gradient {
      background: linear-gradient(135deg, #162234 0%, #297cf2 100%);
    }

    .nafra-panel {
      background: rgba(17, 27, 39, 0.92);
      border: 1px solid rgba(26, 42, 58, 1);
      box-shadow: 0 18px 48px -28px rgba(0, 0, 0, 0.8);
    }

    .nafra-grid {
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 36px 36px;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #243447;
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #297cf2;
    }

    .premium-input {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .premium-input:focus {
      border-color: #297cf2;
      box-shadow: 0 0 0 4px rgba(41, 124, 242, 0.12);
      background: #111b27;
    }
  </style>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="shortcut icon" href="/favicon.svg">
  <meta name="theme-color" content="#0a0f1a">
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "lucide-react": "https://esm.sh/lucide-react@^0.574.0",
    "jszip": "https://esm.sh/jszip@^3.10.1",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0",
    "react-simple-code-editor": "https://esm.sh/react-simple-code-editor@0.13.1",
    "pptxgenjs": "https://esm.sh/pptxgenjs@3.12.0"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
